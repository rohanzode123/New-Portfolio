<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="500" height="350" rx="20" fill="url(#bgGrad1)" />
  
  <!-- Subtle Grid lines -->
  <path d="M50 0 v350 M150 0 v350 M250 0 v350 M350 0 v350 M450 0 v350" stroke="#4338ca" stroke-width="0.5" stroke-opacity="0.3"/>
  <path d="M0 70 h500 M0 140 h500 M0 210 h500 M0 280 h500" stroke="#4338ca" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Chatbot Window Frame -->
  <g filter="url(#shadow1)">
    <rect x="50" y="35" width="400" height="275" rx="14" fill="#0f172a" stroke="#4f46e5" stroke-width="2"/>
    <!-- Window Header -->
    <rect x="50" y="35" width="400" height="42" rx="14" fill="#1e293b"/>
    <rect x="50" y="65" width="400" height="12" fill="#1e293b"/>
    <!-- Window Controls -->
    <circle cx="75" cy="56" r="6" fill="#ef4444"/>
    <circle cx="95" cy="56" r="6" fill="#f59e0b"/>
    <circle cx="115" cy="56" r="6" fill="#10b981"/>
    <!-- Header title -->
    <text x="250" y="61" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Playwright Bot Automation Suite</text>
    
    <!-- Bot Avatar Icon -->
    <g transform="translate(70, 95)">
      <rect width="36" height="36" rx="10" fill="url(#accentGrad1)"/>
      <circle cx="13" cy="16" r="3" fill="#fff"/>
      <circle cx="23" cy="16" r="3" fill="#fff"/>
      <path d="M12 24 Q18 28 24 24" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="16" y="6" width="4" height="4" fill="#fff" rx="1"/>
    </g>

    <!-- Bot Message Bubble -->
    <rect x="118" y="95" width="220" height="45" rx="12" fill="#334155"/>
    <text x="132" y="115" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">Simulating user conversation...</text>
    <text x="132" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Test Case #42: Multi-turn intent</text>
    <!-- Status Pill: Passed -->
    <rect x="360" y="105" width="65" height="24" rx="12" fill="#065f46"/>
    <text x="392" y="121" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓ PASS</text>

    <!-- User Message Bubble -->
    <rect x="160" y="155" width="265" height="42" rx="12" fill="#4338ca"/>
    <text x="175" y="174" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Playwright human keystrokes</text>
    <text x="175" y="188" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10">typing delay: 45ms | button clicks: verified</text>

    <!-- Analytics / Automation Bar -->
    <rect x="70" y="215" width="360" height="45" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="90" y="242" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Dynamic LLM Intent Match</text>
    
    <!-- Progress Indicator -->
    <rect x="250" y="233" width="100" height="8" rx="4" fill="#334155"/>
    <rect x="250" y="233" width="98" height="8" rx="4" fill="#10b981"/>
    <text x="360" y="241" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">100%</text>
    <circle cx="410" cy="237" r="8" fill="#10b981"/>
    <path d="M407 237 l2 2 l4 -4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Bottom Action Ribbon -->
    <rect x="70" y="272" width="100" height="22" rx="6" fill="#475569"/>
    <text x="120" y="287" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Excel/CSV Suite</text>

    <rect x="180" y="272" width="110" height="22" rx="6" fill="#475569"/>
    <text x="235" y="287" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Failure Screenshots</text>

    <rect x="300" y="272" width="130" height="22" rx="6" fill="#4f46e5"/>
    <text x="365" y="287" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">FastAPI + WebSockets</text>
  </g>
</svg>
