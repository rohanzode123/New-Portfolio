<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="500" height="350" rx="20" fill="url(#bgGrad2)" />

  <g filter="url(#shadow2)">
    <!-- Main Center Panel -->
    <rect x="50" y="35" width="400" height="275" rx="14" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Top Badge Header -->
    <rect x="50" y="35" width="400" height="42" rx="14" fill="#0284c7" />
    <rect x="50" y="65" width="400" height="12" fill="#0284c7" />
    <text x="250" y="62" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">🌐 Enterprise AI Chatbot &amp; Voice Bot QA</text>

    <!-- Client brand tags banner -->
    <g transform="translate(65, 90)">
      <rect x="0" y="0" width="70" height="26" rx="6" fill="#1e3a5f" stroke="#0284c7" stroke-width="1"/>
      <text x="35" y="17" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Audi</text>

      <rect x="76" y="0" width="60" height="26" rx="6" fill="#1e3a5f" stroke="#0284c7" stroke-width="1"/>
      <text x="106" y="17" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ITC</text>

      <rect x="142" y="0" width="65" height="26" rx="6" fill="#1e3a5f" stroke="#0284c7" stroke-width="1"/>
      <text x="174" y="17" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Jeep</text>

      <rect x="213" y="0" width="85" height="26" rx="6" fill="#1e3a5f" stroke="#0284c7" stroke-width="1"/>
      <text x="255" y="17" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Hexa Health</text>

      <rect x="304" y="0" width="65" height="26" rx="6" fill="#1e3a5f" stroke="#0284c7" stroke-width="1"/>
      <text x="336" y="17" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">TAFE</text>
    </g>

    <!-- QA Testing Metrics -->
    <g transform="translate(65, 130)">
      <!-- Box 1: Voice Bot STT/TTS -->
      <rect x="0" y="0" width="175" height="65" rx="8" fill="#1e293b" stroke="#334155"/>
      <circle cx="22" cy="22" r="10" fill="#0284c7"/>
      <text x="22" y="26" fill="#fff" font-size="10" text-anchor="middle">🎙️</text>
      <text x="40" y="24" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Voice Bot Testing</text>
      <text x="15" y="45" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">LLM, STT &amp; TTS latency</text>
      <text x="15" y="57" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">✓ 99.9% Uptime Verified</text>

      <!-- Box 2: Millions End-Users -->
      <rect x="190" y="0" width="180" height="65" rx="8" fill="#1e293b" stroke="#334155"/>
      <circle cx="212" cy="22" r="10" fill="#059669"/>
      <text x="212" y="26" fill="#fff" font-size="10" text-anchor="middle">👥</text>
      <text x="230" y="24" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">High-Concurrency QA</text>
      <text x="205" y="45" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Production load &amp; queues</text>
      <text x="205" y="57" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">✓ RabbitMQ &amp; Redis Validated</text>
    </g>

    <!-- Pipeline Status -->
    <g transform="translate(65, 210)">
      <rect x="0" y="0" width="370" height="42" rx="8" fill="#0f172a" stroke="#334155"/>
      <circle cx="25" cy="21" r="9" fill="#10b981"/>
      <path d="M21 21 l3 3 l6 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="45" y="25" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Enterprise Conversational Flow Integrity Test Suite</text>
      <text x="325" y="25" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">PASS</text>
    </g>

    <!-- Bottom Pill List -->
    <g transform="translate(65, 266)">
      <rect x="0" y="0" width="115" height="24" rx="6" fill="#0369a1"/>
      <text x="57" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Multi-turn Dialog</text>

      <rect x="125" y="0" width="115" height="24" rx="6" fill="#0369a1"/>
      <text x="182" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">API Integration</text>

      <rect x="250" y="0" width="120" height="24" rx="6" fill="#0369a1"/>
      <text x="310" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Regression QA</text>
    </g>
  </g>
</svg>
